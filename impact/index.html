<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YLAC Signage</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/signage.css">
</head>
<!-- One screen of the YLAC wall. Edit its words, photos, and links in content/impact.json, not here. -->
<body data-screen="impact">
<main class="stage">
	<div class="backdrop"><div class="pool pool-1"></div><div class="pool pool-2"></div><div class="pool pool-3"></div><div class="dots"></div></div>
	<header class="topbar"><img src="../assets/img/uvu-mono-white.svg" alt="Utah Valley University"><span class="place">Young Living Alumni Center</span></header>
	<div class="ticks" aria-hidden="true"></div>
	<div class="scenes" aria-live="polite"></div>
	<div class="dock"></div>
	<section class="explore" aria-label="Explore">
		<div class="backdrop"><div class="pool pool-1"></div><div class="pool pool-2"></div><div class="dots"></div></div>
	</section>
</main>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../js/signage.js"></script>
</body>
</html>
